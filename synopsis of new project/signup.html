<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for proper document encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign up for Car Customization Platform">
    <title>Sign Up - Car Customization Platform</title>
    
    <!-- Link to external CSS file for styling -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body>
    <!-- Auth page container -->
    <div class="auth-container">
        <!-- Auth card -->
        <div class="auth-card">
            <!-- Header -->
            <header class="auth-header">
                <h1>Create Account</h1>
                <p class="auth-subtitle">Join our car customization platform</p>
            </header>

            <!-- Sign up form -->
            <form id="signupForm" class="auth-form">
                <!-- Full Name field -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        placeholder="Enter your full name"
                        required
                        minlength="2"
                        maxlength="50"
                    >
                    <span class="error-message" id="fullNameError"></span>
                </div>

                <!-- Email field -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >
                    <span class="error-message" id="emailError"></span>
                </div>

                <!-- Password field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Create a password"
                        required
                        minlength="6"
                        maxlength="50"
                    >
                    <span class="error-message" id="passwordError"></span>
                    <small class="form-hint">Must be at least 6 characters</small>
                </div>

                <!-- Confirm Password field -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Confirm your password"
                        required
                    >
                    <span class="error-message" id="confirmPasswordError"></span>
                </div>

                <!-- Phone Number (optional) -->
                <div class="form-group">
                    <label for="phone">Phone Number <span class="optional">(Optional)</span></label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone" 
                        placeholder="Enter your phone number"
                        pattern="[0-9]{10,15}"
                    >
                    <span class="error-message" id="phoneError"></span>
                </div>

                <!-- Submit button -->
                <button type="submit" class="btn-auth" id="signupBtn">
                    Create Account
                </button>

                <!-- Loading state -->
                <div class="loading-message" id="loadingMessage" style="display: none;">
                    Creating your account...
                </div>

                <!-- Success/Error messages -->
                <div class="auth-message" id="authMessage"></div>
            </form>

            <!-- Footer links -->
            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
                <p><a href="index.html">← Back to Home</a></p>
            </div>
        </div>
    </div>

    <!-- Link to authentication JavaScript -->
    <script src="auth.js"></script>
</body>
</html>
